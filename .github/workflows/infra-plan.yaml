name: Infra plan

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

concurrency:
  group: tofu-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
  plan:
    runs-on: ubuntu-latest
    environment: infra-plan
    needs: ci

    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_owner: ${{ github.repository_owner }}
      TF_VAR_repo_name: ${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TOFU_APP_ID }}
          private-key: ${{ secrets.TOFU_APP_PRIVATE_KEY }}

      - uses: cachix/install-nix-action@v31

      - run: nix run ..#discover-rulesets > existing.auto.tfvars.json
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - run: nix run ..#tofu -- init
      - run: nix run ..#tofu -- plan -out=tfplan -input=false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
